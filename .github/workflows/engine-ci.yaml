name: Engine CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Typecheck and format
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build engine preview
        run: npx quartz build

  toolchain:
    runs-on: ubuntu-latest
    name: quartz-sync (cargo)
    defaults:
      run:
        working-directory: tools/quartz-sync
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/quartz-sync

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- --deny warnings

      - name: Tests
        run: cargo test
